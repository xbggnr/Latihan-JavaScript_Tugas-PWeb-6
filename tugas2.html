<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles2.css">
        <title>Pos Indonesia</title>
    </head>
    <body>
        <header>
            <h2>Kode Pos Indonesia</h2>
        </header>
        <form id="form">
            <p>Cari kode pos di wilayah Indonesia dengan memasukkan beberapa kata kunci pencarian di bawah ini.</p>
            <label>Provinsi</label>
            <input type="text" id="provinsi" list="list-provinsi" autocomplete="off" required>
            <datalist id="list-provinsi"></datalist>
            <label>Kota atau Kabupaten</label>
            <input type="text" id="kota" list="list-kota" autocomplete="off" required>
            <datalist id="list-kota"></datalist>
            <label>Masukkan Kata Kunci Pencarian</label>
            <div class="search-group">
                <input type="search" id="kodepos" autocomplete="off" required>
                <button type="submit">Cari</button>
            </div>
        </form>

        <div id="hasil-container">
            <h2>Hasil Pencarian</h2>
            <p id="ringkasan"></p>
            <div id="daftar-hasil"></div>
        </div>

        <script src="Database/tugas2.js"></script>
    </body>
</html>
