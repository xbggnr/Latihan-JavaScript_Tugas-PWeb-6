<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles3-2.css">
        <title>Tugas 3 - Validasi Email</title>
    </head>
    <body>
        <div class="container">
            <h2>Email Validation Form</h2>
            <form id="emailForm">
                <label for="email">Enter your email:</label>

                <span id="error-message" class="error-message"></span>
                <button type="submit">Submit</button>
            </form>
        </div>
        <script src="Database/tugas3-2.js"></script>
    </body>
